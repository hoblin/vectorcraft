# The fork's release: a tag like v0.10.0-bondata.1 builds the Linux x86_64 tarball (the same
# archive as upstream's Linux release) and publishes it as a GitHub release of this repository.
# Nothing is signed and nothing is built for other platforms. See docs/releasing.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  TAG: ${{ github.ref_name }}

jobs:
  linux:
    name: Linux x86_64
    # The oldest GitHub-hosted image, so the binaries only need glibc >= 2.35.
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Japanese, Chinese, Arabic and Thai fonts, embedded by crates/text/build.rs (CRAFT_FONTS_DIR on the build
      # step). Bump the commit deliberately; see craftrules standards/fonts.md.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: 3d9ab3a132ed0eff457e424226a435a901da30d3
          path: craft-fonts
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-linux-x86_64
      - name: Set the version from the tag
        run: |
          cargo xtask version set "${TAG#v}"
          echo "VERSION=${TAG#v}" >>"$GITHUB_ENV"
      - name: Build and package (tar.gz)
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: packaging/linux/package.sh --formats tar
      - name: Check the package
        working-directory: dist/release
        run: |
          tar -tzf "vectorcraft-$VERSION-linux-x86_64.tar.gz" \
            | grep -E '/bin/vectorcraft$|/bin/vectorcraft-cli$'
          sha256sum -- *.tar.gz | tee SHA256SUMS.txt
      - name: Publish the release
        working-directory: dist/release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber -- *
          else
            gh release create "$TAG" --title "VectorCraft $TAG" --generate-notes --verify-tag -- *
          fi
          {
            echo "Release **VectorCraft $TAG** at \`${GITHUB_SHA::9}\`:"
            echo
            sed 's/^/    /' SHA256SUMS.txt
          } >>"$GITHUB_STEP_SUMMARY"
